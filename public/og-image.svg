<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ebe6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <style>
      .logo-line { stroke: #9fe870; stroke-width: 12; stroke-linecap: round; fill: none; }
      .logo-dot { fill: #9fe870; }
      .brand { font-family: Manrope, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 30px; fill: #0e0f0c; }
      .title { font-family: Manrope, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 68px; fill: #0e0f0c; }
      .sub { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 30px; fill: #454745; }
      .pill { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; fill: #163300; }
      .pill-bg { fill: #9fe870; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.05" stroke="#0e0f0c" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- logo -->
  <g transform="translate(72, 64)">
    <rect width="56" height="56" rx="14" fill="#0e0f0c"/>
    <path class="logo-line" d="M15 22h26M15 32h18M15 42h26"/>
    <circle class="logo-dot" cx="41" cy="32" r="3.5"/>
  </g>
  <text class="brand" x="150" y="103">pi-shift-router</text>

  <!-- headline -->
  <text class="title" x="72" y="300">Every turn,</text>
  <text class="title" x="72" y="385">the right role.</text>

  <!-- pill -->
  <rect class="pill-bg" x="72" y="440" width="330" height="56" rx="28"/>
  <text class="pill" x="100" y="478">Fast Programmer · Smart CTO</text>

  <!-- footer strip -->
  <text class="sub" x="72" y="560">Open source · Zero dependencies · pi coding-agent extension</text>
  <text class="sub" x="72" y="596" opacity="0.6">shift-router.greenerai.top</text>
</svg>
